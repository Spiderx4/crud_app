<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crud App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <style>
      /* body {
        text-align: center;
      } */

      button {
        cursor: pointer;
      }

      .update_form {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="m-3 mx-auto" style="width: 500px">
      <h1 class="text-primary text-center">Crud App</h1>

      <br />

      <form class="create_form" id="form">
        <input type="text" name="id" class="id form-control" disabled /> <br />

        <div class="row">
          <div class="col">
            <input
              type="text"
              name="name"
              class="name form-control"
              placeholder="Name"
              required
            />
          </div>
          <div class="col">
            <input
              type="email"
              name="email"
              class="email form-control"
              placeholder="Email"
              required
            />
          </div>
        </div>

        <br />

        <div class="text-center">
          <button type="submit" class="btn btn-success mx-2" onclick="post();">
            Create
          </button>
          <button
            type="submit"
            class="btn btn-primary mx-2"
            onclick="readAll()"
          >
            Read
          </button>
          <button
            type="submit"
            class="btn btn-warning mx-2"
            onclick="updatebtn()"
          >
            Update
          </button>
          <button
            type="submit"
            class="btn btn-danger mx-2"
            onclick="deletebtn()"
          >
            Delete
          </button>
        </div>
        <br />
      </form>

      <form class="update_form" id="form2">
        <input type="text" name="id" class="id" hidden />
        <input type="text" class="uname" required />
        <input type="email" class="uemail" pattern=" @gmail.com" required />
        <button type="submit" class="btn btn-warning" onclick="update()">
          Update
        </button>
      </form>

      <h2 class="text-center">User Details</h2>

      <table class="table table-stripped">
        <thead>
          <th>Name</th>
          <th>Email</th>
          <th>Action</th>
        </thead>
        <tbody class="table_data"></tbody>
      </table>
    </div>

    <script src="script.js"></script>
  </body>
</html>
